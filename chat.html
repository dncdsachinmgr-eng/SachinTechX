<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SachinTechX | AI Chat</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- MATRIX -->
    <canvas id="matrix"></canvas>

    <div class="matrix-overlay"></div>


    <!-- NAVBAR -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            Sachin<span>TechX</span>
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="tools.html">
                Tools
            </a>

            <a href="chat.html" class="active">
                AI Chat
            </a>

        </div>

    </nav>


    <!-- CHAT PAGE -->
    <main class="chat-page">

        <p class="page-label">
            SACHINTECHX / AI SYSTEM
        </p>

        <h1>
            AI <span>CHAT</span>
        </h1>

        <p class="page-description">
            Your intelligent digital conversation space.
        </p>


        <!-- CHAT BOX -->
        <section class="chat-container">

            <div class="chat-header">

                <div class="ai-status"></div>

                <div>
                    <strong>
                        SachinTechX AI
                    </strong>

                    <small>
                        ONLINE
                    </small>
                </div>

            </div>


            <div
                id="chat-messages"
                class="chat-messages"
            >

                <div class="message ai-message">

                    <span class="message-label">
                        AI
                    </span>

                    <p>
                        Hello! Welcome to SachinTechX AI.
                        How can I help you?
                    </p>

                </div>

            </div>


            <div class="chat-input-area">

                <input
                    id="chat-input"
                    type="text"
                    placeholder="Type your message..."
                    autocomplete="off"
                >

                <button
                    onclick="sendMessage()"
                >
                    SEND
                </button>

            </div>

        </section>


        <a href="tools.html" class="back-link">
            ← BACK TO BRANCHES
        </a>

    </main>


    <script src="script.js"></script>

</body>
</html>
